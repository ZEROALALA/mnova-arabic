<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الصفحة غير موجودة (404) | MNOVA للتعريب</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png">
<meta name="theme-color" content="#0c101d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c101d;--sf:#141a2b;--ln:rgba(255,255,255,.1);--tx:#f4f6fb;--mu:#94a3b8;--ac:#ffb72b;--f1:'Reem Kufi',sans-serif;--f2:'Tajawal',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--f2);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.box{max-width:560px;background:var(--sf);border:1px solid var(--ln);border-radius:22px;padding:36px 26px}
.code{font-family:var(--f1);font-size:64px;color:var(--ac);line-height:1;margin-bottom:10px}
h1{font-family:var(--f1);font-size:26px;margin-bottom:12px}
p{color:var(--mu);font-size:15px;line-height:1.7;margin-bottom:24px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{padding:12px 22px;border-radius:12px;font-weight:700;font-size:14.5px;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.pr{background:linear-gradient(135deg,var(--ac),#ff9500);color:#0c101d}
.sc{background:#1b233a;border:1px solid var(--ln);color:var(--tx)}
</style>
</head>
<body>
<main class="box">
  <div class="code">404</div>
  <h1>عذراً، هذه الصفحة غير موجودة</h1>
  <p>ربما تغيّر الرابط أو تم نقله. يمكنك العودة إلى الصفحة الرئيسية لموقع <strong>MNOVA للتعريب</strong> أو تصفّح دليل التعريبات الكامل.</p>
  <div class="btns">
    <a class="btn pr" href="/">🏠 الصفحة الرئيسية MNOVA</a>
    <a class="btn sc" href="/games/">🎮 مكتبة التعريبات</a>
  </div>
</main>
</body>
</html>
